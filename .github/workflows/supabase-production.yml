name: Supabase Production

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-production.yml'
  workflow_dispatch:

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check production credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Supabase production credentials are not configured; migration deployment skipped safely."
          fi

      - name: Setup Supabase CLI
        if: steps.credentials.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        if: steps.credentials.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Show pending migrations
        if: steps.credentials.outputs.ready == 'true'
        run: supabase migration list --linked

      - name: Apply pending migrations
        if: steps.credentials.outputs.ready == 'true'
        run: supabase db push --linked --include-all

      - name: Verify remote migration state
        if: steps.credentials.outputs.ready == 'true'
        run: supabase migration list --linked

      - name: Lint production database
        if: steps.credentials.outputs.ready == 'true'
        run: supabase db lint --linked --level warning
